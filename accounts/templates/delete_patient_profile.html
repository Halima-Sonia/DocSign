{% extends 'base.html' %}

{% block title %}Delete Patient Profile | DocSign{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="delete-card">

        <div class="delete-icon">⚠️</div>

        <h1>Delete Patient Profile?</h1>

        <p>
            Are you sure you want to delete your patient profile?
            This will remove the profile information stored in DocSign.
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="delete-actions">

                <a href="{% url 'patient_profile' %}"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="confirm-delete-btn">
                    Yes, Delete Profile
                </button>

            </div>

        </form>

    </div>

</div>


<style>

.delete-card {
    max-width: 550px;
    margin: 60px auto;
    padding: 45px 35px;
    text-align: center;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
}

.delete-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.delete-card h1 {
    color: var(--text);
    font-weight: 700;
    margin-bottom: 15px;
}

.delete-card p {
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 30px;
}

.delete-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
}

.cancel-btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
}

.confirm-delete-btn {
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    background: #c0392b;
    color: white;
    font-weight: 600;
}

.confirm-delete-btn:hover {
    background: #a93226;
}

@media (max-width: 576px) {
    .delete-actions {
        flex-direction: column;
    }

    .cancel-btn,
    .confirm-delete-btn {
        width: 100%;
    }
}

</style>

{% endblock %}
